<!doctype html>
<html lang="en" data-theme="rimworld">
<head>
  <meta charset="utf-8" />
  <title>RimWorld Mod Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="puzzle"></i></span>
      <span class="brand-name">RimWorld <b>Mod Library</b></span>
    </div>
    <div class="titlebar-search">
      <i data-lucide="search"></i>
      <input id="globalSearch" type="search" data-i18n-placeholder="nav.searchPlaceholder" autocomplete="off" />
    </div>
    <div class="titlebar-status" id="globalStatus"></div>
  </header>

  <div class="shell">
    <nav class="sidebar">
      <div class="nav-group">
        <div class="nav-label" data-i18n="nav.myMods"></div>
        <button class="nav-item" data-view="library"><i data-lucide="library"></i><span data-i18n="nav.library"></span><em class="badge" id="badgeLibrary"></em></button>
        <button class="nav-item" data-view="loadorder"><i data-lucide="list-ordered"></i><span data-i18n="nav.loadOrder"></span><em class="badge badge-warn" id="badgeIssues"></em></button>
        <button class="nav-item" data-view="modlists"><i data-lucide="list-checks"></i><span data-i18n="nav.modLists"></span></button>
        <button class="nav-item" data-view="updates"><i data-lucide="refresh-cw"></i><span data-i18n="nav.updates"></span><em class="badge badge-accent" id="badgeUpdates"></em></button>
      </div>
      <div class="nav-group">
        <div class="nav-label" data-i18n="nav.workshop"></div>
        <button class="nav-item" data-view="workshop"><i data-lucide="compass"></i><span data-i18n="nav.browse"></span></button>
        <button class="nav-item" data-view="suggestions"><i data-lucide="sparkles"></i><span data-i18n="nav.suggestions"></span></button>
        <button class="nav-item" data-view="collections"><i data-lucide="layers"></i><span data-i18n="nav.collections"></span></button>
        <button class="nav-item" data-view="downloads"><i data-lucide="download"></i><span data-i18n="nav.downloads"></span><em class="badge badge-accent" id="badgeDownloads"></em></button>
      </div>
      <div class="nav-spacer"></div>
      <button class="nav-item" data-view="about"><i data-lucide="info"></i><span data-i18n="nav.about"></span><em class="badge badge-accent" id="badgeAbout"></em></button>
      <button class="nav-item" data-view="settings"><i data-lucide="settings"></i><span data-i18n="nav.settings"></span></button>
      <div class="game-card">
        <div class="game-card-info">
          <i data-lucide="gamepad-2"></i>
          <div>
            <div class="game-title">RimWorld</div>
            <div class="game-meta" id="gameMeta">–</div>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="btnLaunch"><i data-lucide="play"></i><span data-i18n="nav.play"></span></button>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
  <div class="lightbox" id="lightbox"><img alt="" /></div>
  <div class="toasts" id="toasts"></div>

  <script src="vendor/lucide.min.js"></script>
  <script src="i18n.js"></script>
  <script src="bridge.js"></script>
  <script src="bbcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
